# Ciągła integracja: kompilacja bez ostrzeżeń i migracje na pustej bazie.
# Czerwony wynik = pull request nie do scalenia. Samo zablokowanie scalania ustawia się w GitHubie:
# Settings → Branches → reguła dla main → „Require status checks to pass before merging” → zadanie „build”.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Przywrócenie pakietów
        run: dotnet restore

      - name: Kompilacja (ostrzeżenie = błąd)
        run: dotnet build --no-restore -warnaserror

      # Prawdziwy SQL Server: ograniczenia CHECK, indeksy filtrowane i klucze obce sprawdza silnik.
      # Hasło jest losowane w tym przebiegu i maskowane w logu — nie ma go w repozytorium.
      - name: SQL Server 2022 w kontenerze
        run: |
          HASLO="Ci-$(openssl rand -hex 16)-aA1!"
          echo "::add-mask::$HASLO"
          docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$HASLO" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for proba in $(seq 1 30); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$HASLO" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server gotowy po $proba próbach."
              break
            fi
            if [ "$proba" = 30 ]; then docker logs sql; exit 1; fi
            sleep 2
          done
          echo "ConnectionStrings__Default=Server=localhost,1433;User Id=sa;Password=$HASLO;TrustServerCertificate=True;Database=PrzewodnikSWPW_CI" >> "$GITHUB_ENV"

      # Migracje muszą się wykonać od zera, a model nie może wyprzedzać ostatniej migracji.
      - name: Migracje EF Core na pustej bazie
        run: |
          dotnet tool restore
          dotnet ef database update --no-build
          dotnet ef migrations has-pending-model-changes --no-build
